<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Gallery — Magic Murals (dev host)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: content-box;
      }
      body {
        margin: 0;
        font-family: Mulish, sans-serif;
        color: #393939;
        background: #ffffff;
      }
      h1,
      h2 {
        font-family: Poppins, sans-serif;
      }
      .site-header,
      .site-footer {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e0e0e0;
      }
      .site-footer {
        border-bottom: none;
        border-top: 1px solid #e0e0e0;
        margin-top: 3rem;
        font-size: 0.875rem;
        color: #666;
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      a {
        color: #3c9b35;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <strong>Magic Murals</strong> — dev host page (simulates Magento layout)
    </header>
    <main>
      <h1>Customer Gallery</h1>
      <p>
        See how our wall murals look in real homes and businesses. Use filters and search below, or
        <a href="?share=1">share your own photo</a>.
      </p>

      <!-- Production embed (built assets):
      <div id="mmg-gallery"></div>
      <script src="/gallery-assets/mmg.js" defer></script>
      -->

      <div id="mmg-gallery"></div>
      <script type="module" src="/src/main.js"></script>
    </main>
    <footer class="site-footer">Footer placeholder — not part of the gallery widget.</footer>
  </body>
</html>
